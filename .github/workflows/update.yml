name: Atualizar skins
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - run: |
          git config user.name "skins-bot"
          git config user.email "skins-bot@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza skins" || exit 0
          git push
